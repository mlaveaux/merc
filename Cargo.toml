[workspace.package]
edition = "2024"
homepage = "https://mercorg.github.io/merc-website/"
repository = "https://github.com/MERCorg/merc.git"
license = "BSL-1.0"
rust-version = "1.93.1"
version = "2.0.0"

# Add debug information to the release binaries.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev]
split-debuginfo = "packed"

[workspace]
resolver = "3"
members = [
    "crates/aterm",
    "crates/aterm/benchmarks",
    "crates/collections",
    "crates/data",
    "crates/enumerate",
    "crates/enumerate/benchmarks",
    "crates/explore",
    "crates/io",
    "crates/lps",
    "crates/lts",
    "crates/lts/benchmarks",
    "crates/macros",
    "crates/number",
    "crates/rec-tests",
    "crates/reduction",
    "crates/refinement",
    "crates/sabre_compiling",
    "crates/sabre_compiling/sabre_ffi",
    "crates/sabre",
    "crates/sabre/benchmarks",
    "crates/sharedmutex",
    "crates/sharedmutex/benchmarks",
    "crates/symbolic",
    "crates/symbolic/benchmarks",
    "crates/syntax",
    "crates/tools",
    "crates/typecheck",
    "crates/unsafety",
    "crates/unsafety/benchmarks",
    "crates/utilities",
    "crates/utilities/benchmarks",
    "crates/vpg",
    "crates/vpg/benchmarks",
    "crates/xtask",
    "tools/lts",
    "tools/rewrite",
    "tools/sym",
    "tools/vpg",
]

[workspace.lints.rustdoc]
# Several public functions/types intentionally link to crate-internal items
# from their doc comments (e.g. to explain an implementation detail without
# exposing it). Keep the links themselves (so a rename still trips the
# separate, still-denied `broken_intra_doc_links` lint) but don't fail the
# build just because the linked item isn't publicly reachable.
private_intra_doc_links = "allow"

[workspace.dependencies]
ahash = "0.8"
bitstream-io = "4.10"
bitvec = "1.1"
bumpalo = "3.20"
clap = { version = "4.6", features = ["derive"] }
core_affinity2 = "0.16"
dashmap = { version = "7.0.0-rc2", features = ["inline-more"] }
delegate = "0.13"
ena = "0.14"
env_logger = { version = "0.11", features = ["kv"] }
equivalent = "1.0"
hashbrown = "0.17"
html-escape = "0.2"
itertools = "0.15"
log = { version = "0.4", features = ["kv"] }
num = "0.4"
oxidd = { version = "0.12", features = ["manager-pointer", "multi-threading"] }
oxidd-dump = "0.7"
oxidd-core = "0.12"
oxidd-reorder = "0.7"
oxidd-rules-bdd = "0.12"
oxidd-rules-ldd = "0.11"
parking_lot = "0.12"
pest = "2.9"
pest_derive  = "2.9"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
rustc-hash = "2.1"
smallvec = "1.15"
thiserror = "2.0"
toml = "1.1"
winapi = { version = "0.3", features = ["consoleapi", "wincon"] }

# Used for the compiling rewriter
libloading = "0.9"

# Used by the lower level crates
allocator-api2 =  "0.4"
backtrace = "0.3"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
loom = { version = "0.7", features = ["checkpoint"] }
mimalloc = "0.1"
quanta = "0.12"
streaming-iterator = "0.1"
thread_local = "1.1"
tikv-jemallocator = "0.7"

# Used in macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

# Used for xtask
duct = "1.1"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0"

# Used in tests
indoc  = "2.0"
test-case  = "3.3"
test-log = "0.2"
trybuild = "1.0"
tempfile = "3.27"

# Used for benchmarks
criterion = "0.8"

# Used for the cadp FFI
bindgen = "0.72"

# The workspace crates.
merc_aterm = { version = "3.0", path = "crates/aterm" }
merc_collections = { version = "3.0", path = "crates/collections" }
merc_data = { version = "3.0", path = "crates/data" }
merc_enumerate = { version = "0.1", path = "crates/enumerate" }
merc_explore = { version = "2.0", path = "crates/explore" }
merc_io = { version = "3.0", path = "crates/io" }
merc_lps = { version = "0.1", path = "crates/lps" }
merc_lts = { version = "3.0", path = "crates/lts" }
merc_macros = { version = "2.0", path = "crates/macros" }
merc_number = { version = "3.0", path = "crates/number" }
merc_rec-tests = { path = "crates/rec-tests" }
merc_reduction = { version = "3.0", path = "crates/reduction" }
merc_refinement = { version = "3.0", path = "crates/refinement" }
merc_sabre = { version = "3.0", path = "crates/sabre" }
merc_sabre-compiling = { path = "crates/sabre_compiling" }
merc_sabre-ffi = { path = "crates/sabre_compiling/sabre_ffi" }
merc_sharedmutex = { version = "3.0", path = "crates/sharedmutex" }
merc_symbolic = { version = "3.0",path = "crates/symbolic", features = ["clap"] }
merc_syntax = { version = "3.0", path = "crates/syntax" }
merc_tools = { path = "crates/tools" }
merc_typecheck = { path = "crates/typecheck" }
merc_unsafety = { version = "3.0", path = "crates/unsafety" }
merc_utilities = { version = "3.0", path = "crates/utilities" }
merc_vpg = { version = "3.0", path = "crates/vpg", features = ["clap"] }

# Vendored libraries
merc_pest_consume = { version = "2.0", git = "https://github.com/MERCorg/pest_consume" }
merc_pest_consume_macros = { version = "2.0", git = "https://github.com/MERCorg/pest_consume" }

# The pest_consume macros generate different enum representations for every build.
[workspace.metadata.cargo-semver-checks.lints]
enum_no_repr_variant_discriminant_changed = "allow"
partial_ord_enum_variants_reordered = "allow"

# Use a local checkout of the oxidd fork until the LDD branch is integrated.
[patch.crates-io]
oxidd = { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }
oxidd-core = { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }
oxidd-dump =  { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }
oxidd-reorder = { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }
oxidd-rules-bdd = { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }
oxidd-rules-ldd = { git = "https://github.com/mlaveaux/oxidd", rev = "4d959db12026bdd1b9cfe2f477c555b8497b4daf" }