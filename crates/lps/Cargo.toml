[package]
name = "merc_lps"
description = "Native reader for mCRL2's binary Linear Process Specification (.lps) format, and a data-backed Summand/LPS implementation on top of merc_enumerate."
keywords = ["lps", "process", "exploration", "data"]
categories = ["science"]
readme = "README.md"
version = "0.1.0"

edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Tracks per-summand cache and control-flow pruning counters during exploration.
metrics = ["merc_explore/metrics"]

[dependencies]
merc_aterm.workspace = true
merc_collections.workspace = true
merc_data.workspace = true
merc_enumerate.workspace = true
merc_explore.workspace = true
merc_io.workspace = true
merc_lts.workspace = true
merc_macros.workspace = true
merc_sabre.workspace = true
merc_syntax.workspace = true
merc_typecheck.workspace = true
merc_utilities.workspace = true

ahash.workspace = true
delegate.workspace = true
itertools.workspace = true
log.workspace = true
