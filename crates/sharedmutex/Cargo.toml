[package]
name = "merc_sharedmutex"
description = "A read efficient readers-writer lock based on the busy-forbidden protocol."
keywords = ["mutex", "thread", "rwlock"]
categories = ["concurrency"]
readme = "README.md"
version = "3.0.0"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
merc_utilities.workspace = true

crossbeam-utils.workspace = true
delegate.workspace = true

[dev-dependencies]
rand.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(loom)'] }

# Makes it possible to check functional contracts in kani.
[package.metadata.kani]
unstable = { function-contracts = true, mem-predicates = true }